<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMove</title>
    <!-- CDN do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Coluna Esquerda: Perfil / Sidebar -->
    <aside class="sidebar">
        <div class="profile-card">
            <div id="user-avatar" class="avatar-placeholder">
                <!-- Imagem do logo quando deslogado -->
                <img id="img-logo-sidebar" src="logo.png" alt="EcoMove Logo">
            </div>
            <h2 id="profile-name">EcoMove</h2>
            <div class="stats">
                <p><i class="fa-solid fa-chart-line"></i> Qtd. Atividades: <span id="stat-atividades">5</span></p>
                <p><i class="fa-solid fa-leaf"></i> Qtd. CO₂ (kg): <span id="stat-co2">1.62</span></p>
            </div>
            <button id="btn-atividade" class="btn-atividade" disabled>
                <i class="fa-solid fa-plus"></i> Atividade
            </button>
        </div>

        <footer class="sidebar-footer">
            <p class="brand-footer">EcoMove</p>
            <div class="social-icons">
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-x-twitter"></i>
                <i class="fa-brands fa-tiktok"></i>
            </div>
            <p class="copyright">Copyright-2024</p>
        </footer>
    </aside>

    <!-- Coluna Direita: Conteúdo Principal -->
    <main class="main-content">
        <header class="header">
            <button id="btn-auth" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </header>

        <!-- Barra de Filtros -->
        <nav class="filters">
            <button onclick="filtrar('Bicicleta')"><i class="fa-solid fa-bicycle"></i> Bicicleta</button>
            <button onclick="filtrar('Caminhada')"><i class="fa-solid fa-person-walking"></i> Caminhada</button>
            <button onclick="filtrar('Transporte público')"><i class="fa-solid fa-bus"></i> Transporte público</button>
            <button onclick="filtrar('Todos')"><i class="fa-solid fa-border-all"></i> Todos</button>
        </nav>

        <!-- Formulário de Nova Atividade -->
        <section id="sec-cadastrar" class="form-container hidden">
            <h3><i class="fa-solid fa-pen-to-square"></i> Crie sua atividade</h3>
            <div class="form-group">
                <label>Tipo da atividade</label>
                <select id="tipo-atividade">
                    <option value="Bicicleta">Bicicleta</option>
                    <option value="Caminhada">Caminhada</option>
                    <option value="Transporte público">Transporte público</option>
                </select>
            </div>
            <div class="form-group">
                <label>Distância (metros)</label>
                <input type="number" id="input-distancia" placeholder="Ex: 1000">
            </div>
            <div class="form-group">
                <label>Duração (minutos)</label>
                <input type="number" id="input-duracao" placeholder="Ex: 30">
            </div>
            <button onclick="salvarAtividade()" class="btn-primary">
                <i class="fa-solid fa-check"></i> Criar Atividade
            </button>
        </section>

        <!-- Feed de Atividades -->
        <section id="feed-atividades" class="feed"></section>

        <!-- Paginação -->
        <div class="pagination">
            <button id="btn-anterior" class="page-btn" disabled><i class="fa-solid fa-chevron-left"></i> Anterior</button>
            <button class="page-btn active" id="page-1">1</button>
            <button id="btn-proximo" class="page-btn">Próximo <i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </main>

    <!-- Modal de Autenticação (Login e Cadastro) -->
    <div id="modal-login" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title"><i class="fa-solid fa-lock"></i> Login</h3>
                <span class="btn-close" onclick="fecharModal()">&times;</span>
            </div>

            <!-- Formulário de Login -->
            <div id="form-login-body" class="modal-body">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="seuemail@exemplo.com">
                    <span id="err-email" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-senha" placeholder="******">
                    <span id="err-senha" class="error-message"></span>
                </div>
                <div class="toggle-auth">
                    <span>Não tem uma conta? <a href="#" onclick="alternarAba('cadastrar')">Cadastre-se</a></span>
                </div>
                <div class="modal-actions">
                    <button onclick="fecharModal()" class="btn-cancel">Cancelar</button>
                    <button onclick="realizarLogin()" class="btn-confirm">Login</button>
                </div>
            </div>

            <!-- Formulário de Cadastro -->
            <div id="form-cadastro-body" class="modal-body hidden">
                <div class="form-group">
                    <label>Nome do Usuário</label>
                    <input type="text" id="cad-nome" placeholder="Ex: Usuário_01">
                    <span id="err-cad-nome" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="cad-email" placeholder="seuemail@exemplo.com">
                    <span id="err-cad-email" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cad-senha" placeholder="******">
                    <span id="err-cad-senha" class="error-message"></span>
                </div>
                <div class="toggle-auth">
                    <span>Já possui conta? <a href="#" onclick="alternarAba('login')">Fazer Login</a></span>
                </div>
                <div class="modal-actions">
                    <button onclick="fecharModal()" class="btn-cancel">Cancelar</button>
                    <button onclick="realizarCadastro()" class="btn-confirm">Cadastrar</button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
